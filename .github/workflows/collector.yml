name: Collect Coastal Data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: collect-coastal-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSLMODE: require
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          NOTIFICATION_TEST_MODE: "true"
          NOTIFICATION_MAX_RETRIES: "2"
        run: |
          python - <<'PY'
          from weather_api_test import fetch_and_store
          from services.coastal_data_service import CoastalDataService
          from services.storm_data_service import StormDataService
          from services.risk_assessment_service import RiskAssessmentService

          fetch_and_store()
          CoastalDataService().collect_all()
          StormDataService().collect_current_cyclones()
          RiskAssessmentService().assess_all()
          PY
